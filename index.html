<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إلى سميرة.. وتين قلبي</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d0b11;
      --card-bg: rgba(26, 20, 35, 0.85);
      --accent: #d4af37;
      --pink: #d946ef;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      direction: rtl;
      padding: 20px 15px 70px;
      background-image: radial-gradient(circle at 50% 20%, #2e1065 0%, #0d0b11 70%);
    }
    .container { max-width: 500px; width: 100%; text-align: center; }
    .title { font-family: 'Amiri', serif; font-size: 2rem; color: var(--accent); margin-top: 15px; margin-bottom: 5px; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
    .image-container {
      width: 170px; height: 170px; margin: 0 auto 15px; border-radius: 50%; padding: 4px;
      background: linear-gradient(135deg, var(--accent), var(--pink)); cursor: pointer;
      box-shadow: 0 0 25px rgba(217, 70, 239, 0.4);
    }
    .image-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .timer-card {
      background: var(--card-bg); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 16px;
      padding: 15px; margin-bottom: 20px;
    }
    .timer-label { font-size: 0.85rem; color: var(--accent); margin-bottom: 12px; }
    .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .timer-box { background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 8px 4px; }
    .timer-num { font-size: 1.3rem; font-weight: 700; color: #fff; display: block; }
    .timer-txt { font-size: 0.7rem; color: var(--text-muted); }
    
    /* زر التحكم في صوت الخلفية */
    .bg-music-toggle {
      background: rgba(217, 70, 239, 0.2);
      border: 1px solid var(--pink);
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(5px);
    }

    .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .feature-card {
      background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px;
      padding: 15px 5px; cursor: pointer;
      transition: transform 0.2s;
    }
    .feature-card:active { transform: scale(0.95); }
    .feature-icon { font-size: 1.6rem; margin-bottom: 5px; display: block; }
    .feature-name { font-size: 0.85rem; font-weight: 600; }
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      z-index: 100; align-items: center; justify-content: center; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #171221; border: 1px solid var(--accent); border-radius: 18px;
      max-width: 350px; width: 100%; padding: 20px; text-align: center; position: relative;
    }
    .modal-close { position: absolute; top: 10px; left: 10px; background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    .modal-title { color: var(--accent); font-size: 1.2rem; margin-bottom: 10px; font-family: 'Amiri', serif; }
    .modal-text { color: #e5e7eb; font-size: 0.9rem; line-height: 1.7; }

    /* مشغل اليوتيوب المخفي في الخلفية */
    #bgPlayerWrapper {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>

      <img src="temp_image_74D8A7CB-D571-4AFA-8C01-6439A6ADCADC.jpeg" alt="سميرة">
    </div>

    <p class="subtitle">بداية حكايتنا وأجمل أقداري</p>

    <!-- زر كتم / تشغيل صوت الخلفية -->
    <div>
      <button class="bg-music-toggle" id="bgAudioBtn" onclick="toggleBackgroundAudio(event)">
        <span id="audioIcon">🎵</span> <span id="audioStatus">موسيقى الخلفية: اضغط للتشغيل</span>

    <div class="timer-card">

      <div class="timer-grid">
        <div class="timer-box"><span class="timer-num" id="days">0</span>
